# Insider Form 4 signal test, the fast (T+2) disclosure channel.
#
# Kept SEPARATE from the main backtest because Form 4 spans the whole market
# (far more tickers than Congress), so it uses its OWN cache namespace
# (copytrade-insider-data-) that the main real-backtest does NOT restore
# insider data can never bloat the congressional price universe. It DOES fall
# back to the main cache to reuse already-fetched SPY/prices.
#
# Trigger: push with "[insiders]" in the commit message, or manual dispatch.
# Read results: the final step re-prints the insiders table into the job log
# tail; the reports artifact has insiders.txt.

name: insider-backtest

on:
  workflow_dispatch:
  push:
    branches: ["claude/copy-trading-backtest-1ba32a"]

permissions:
  contents: read

jobs:
  insiders:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[insiders]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COPYTRADE_TIINGO_API_KEY: ${{ secrets.COPYTRADE_TIINGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/cache/restore@v4
        with:
          path: data
          key: copytrade-insider-data-${{ github.run_id }}
          restore-keys: |
            copytrade-insider-data-
            copytrade-data-

      - name: Prepare dirs
        run: mkdir -p reports data

      - name: Backfill insider Form 4 (DERA bulk, 2021-2025; resumable)
        # 5 years so the Cohen-Malloy routine/opportunistic split (needs >=3
        # years of history) is valid. Downloaded ZIPs + trade dedup make
        # re-runs cheap, so this fills in progressively if a run times out.
        run: |
          for y in 2021 2022 2023 2024 2025; do
            for q in 1 2 3 4; do
              echo "== ${y}q${q} =="
              python -m copytrade backfill-form345 "${y}q${q}" || true
            done
          done

      - name: Insider signal test (vs SPY and vs size-matched IWM)
        run: |
          echo "########## benchmark: SPY (mega-cap) ##########" | tee reports/insiders.txt
          python -m copytrade insiders --benchmark SPY 2>&1 | tee -a reports/insiders.txt
          echo -e "\n########## benchmark: IWM (small-cap, size-matched) ##########" | tee -a reports/insiders.txt
          python -m copytrade insiders --benchmark IWM 2>&1 | tee -a reports/insiders.txt

      - name: Echo insiders table at job end (log-tail reach)
        if: always()
        run: cat reports/insiders.txt 2>/dev/null || echo "(insiders.txt missing)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insider-reports
          path: reports/
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: copytrade-insider-data-${{ github.run_id }}
