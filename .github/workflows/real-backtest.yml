# The REAL priced backtest: the step no restricted sandbox can run.
# GitHub-hosted runners have open egress, so this pulls real senate PTRs,
# real USD/CAD, real yfinance prices, and produces the full report.
#
# Read results: the job summary shows reports/README.md (stats tables,
# bootstrap p-value, track records); the 'reports' artifact has the PNGs/CSVs.
# Optional: add repo secret COPYTRADE_FINNHUB_API_KEY to also pull live
# congress data + news.

name: real-backtest

on:
  workflow_dispatch:
  push:
    branches: ["claude/copy-trading-backtest-1ba32a"]
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = 13:30 PT, after US close

permissions:
  contents: read

jobs:
  backtest:
    # push events only run when the commit message opts in with "[backtest]"
    # (dispatch and cron always run)
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[backtest]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COPYTRADE_FINNHUB_API_KEY: ${{ secrets.COPYTRADE_FINNHUB_API_KEY }}
      COPYTRADE_WEBHOOK_URL: ${{ secrets.COPYTRADE_WEBHOOK_URL }}
      COPYTRADE_TIINGO_API_KEY: ${{ secrets.COPYTRADE_TIINGO_API_KEY }}
      COPYTRADE_QUIVER_API_KEY: ${{ secrets.COPYTRADE_QUIVER_API_KEY }}
      COPYTRADE_OPENFIGI_API_KEY: ${{ secrets.COPYTRADE_OPENFIGI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # price/DB cache across runs: restore newest, save under a unique key
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: copytrade-data-${{ github.run_id }}
          restore-keys: copytrade-data-

      - name: Ingest real senate PTRs (+ party enrichment)
        run: python -m copytrade ingest-senate
      - name: Real USD/CAD FX
        run: python -m copytrade fx-refresh
      - name: Live congress via Finnhub (only if key configured)
        if: env.COPYTRADE_FINNHUB_API_KEY != ''
        # an aggregator outage or tier restriction must never block the core
        # backtest: failures are reported in the step output, not fatal
        continue-on-error: true
        run: python -m copytrade backfill-congress --years 2
      - name: Famous-fund 13F holdings (Burry puts, Buffett, Ackman...)
        continue-on-error: true
        run: python -m copytrade backfill-funds --quarters 6
      - name: Real daily adjusted closes (yfinance)
        timeout-minutes: 45
        run: python -m copytrade prices --start 2012-01-01
      - name: Report (ranking, decay, walk-forward, allocation, taxlots)
        run: python -m copytrade report
      - name: Track records + sleeve plan (text outputs)
        run: |
          python -m copytrade profits --top 25 | tee reports/profits.txt
          python -m copytrade allocate | tee reports/allocate.txt
      - name: Full timeline (year-by-year copy-all vs SPY, recent-years attention)
        continue-on-error: true
        run: python -m copytrade timeline | tee reports/timeline.txt
      - name: Congress conviction signals (cluster / large / abnormal buys)
        continue-on-error: true
        run: python -m copytrade conviction | tee reports/conviction.txt
      - name: Factor attribution (Fama-French + RSP; is it just the size factor?)
        continue-on-error: true
        run: python -m copytrade factors | tee reports/factors.txt
      - name: Net edge (absolute scorecard + beta-neutral long/short + consensus CAR)
        continue-on-error: true
        run: python -m copytrade netedge | tee reports/netedge.txt
      - name: Full metrics battery + regime filter vs popular ETFs (QQQ/VTI/IWM/SCHD)
        continue-on-error: true
        run: python -m copytrade greeks | tee reports/greeks.txt
      - name: Recent-era viability (2022+ and 2024+ slices)
        continue-on-error: true
        run: |
          echo "########## since 2022-01-01 ##########" | tee reports/recent.txt
          python -m copytrade recent --since 2022-01-01 2>&1 | tee -a reports/recent.txt || true
          echo -e "\n########## since 2024-01-01 ##########" | tee -a reports/recent.txt
          python -m copytrade recent --since 2024-01-01 2>&1 | tee -a reports/recent.txt || true
      - name: Per-individual roster (mirror alpha vs SPY, all windows, consistency)
        continue-on-error: true
        run: python -m copytrade roster | tee reports/roster.txt
      - name: Sector map refresh (yfinance; cached + resumable)
        continue-on-error: true
        timeout-minutes: 25
        run: python -m copytrade sectors-refresh --limit 700 || true
      - name: Area / holdings attribution (sectors, best names, per-filer footprint)
        continue-on-error: true
        run: python -m copytrade areas | tee reports/areas.txt
      - name: Single-filer mirrors (Pelosi et al. vs SPY)
        continue-on-error: true
        run: |
          for who in "Pelosi" "Torres" "Loeffler" "Greene"; do
            echo "===== mirror: $who =====" | tee -a reports/mirrors.txt
            python -m copytrade mirror "$who" 2>&1 | tee -a reports/mirrors.txt || true
          done
      - name: Derivatives & futures section
        continue-on-error: true
        run: |
          python -m copytrade cftc-refresh || true
          python -m copytrade derivatives | tee reports/derivatives.txt
      - name: Disclosure-lag decomposition
        continue-on-error: true
        run: python -m copytrade lag | tee reports/lag.txt

      # Re-echo the compact text analyses LAST so they're always reachable in
      # the job-log tail (the log API truncates to the final chunk).
      - name: Echo compact analyses (timeline, recent) at job end
        if: always()
        run: |
          for f in greeks netedge factors conviction timeline recent; do
            echo "========== reports/${f}.txt =========="
            cat "reports/${f}.txt" 2>/dev/null || echo "(missing)"
          done

      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/README.md ]; then
            cat reports/README.md >> "$GITHUB_STEP_SUMMARY"
            echo -e "\n\n---\n_PNGs and CSVs are in the **reports** artifact._" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "report was not generated, check the failing step's logs" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
          if-no-files-found: warn
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: copytrade-data-${{ github.run_id }}
