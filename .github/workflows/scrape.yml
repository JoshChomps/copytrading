# Constant scraping without a server: every 6 hours, run each enabled source
# once (scrape-once), persisting the DB via the actions cache. Authoritative
# feeds (EDGAR Form 4, House Clerk, Senate eFD) need no keys; Finnhub lights
# up when the secret exists. Caveat vs a real VPS: Actions cron is best-effort
# (runs can be delayed/skipped) and cache is best-effort storage, fine for
# hours-cadence disclosure scraping, wrong for the 3-minute Form 4 loop.
# See docs/SCRAPING.md for the VPS shape when you want minute-level polling.

name: scrape

on:
  workflow_dispatch:
  push:
    branches: ["claude/copy-trading-backtest-1ba32a"]
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read

jobs:
  scrape:
    # push events only run when the commit message opts in with "[scrape]"
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[scrape]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COPYTRADE_FINNHUB_API_KEY: ${{ secrets.COPYTRADE_FINNHUB_API_KEY }}
      COPYTRADE_WEBHOOK_URL: ${{ secrets.COPYTRADE_WEBHOOK_URL }}
      COPYTRADE_TIINGO_API_KEY: ${{ secrets.COPYTRADE_TIINGO_API_KEY }}
      COPYTRADE_QUIVER_API_KEY: ${{ secrets.COPYTRADE_QUIVER_API_KEY }}
      COPYTRADE_OPENFIGI_API_KEY: ${{ secrets.COPYTRADE_OPENFIGI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pdfplumber
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: copytrade-data-${{ github.run_id }}
          restore-keys: copytrade-data-
      - name: Run every enabled source once
        run: python -m copytrade scrape-once
      - name: House multi-year backfill (opt-in via commit tag)
        # heavy one-time pull of 2021-2026 House PTR PDFs; seen-DocID state in
        # the cached DB makes re-runs cheap/idempotent. Add '[reparse-house]'
        # to the commit to rebuild ALL rows with the current parser (needed
        # after the options-detection change): re-downloads, so slower.
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[house-backfill]')
        run: |
          REPARSE=""
          if [[ "${{ github.event.head_commit.message }}" == *"[reparse-house]"* ]]; then REPARSE="--reparse"; fi
          for y in 2021 2022 2023 2024 2025 2026; do
            python -m copytrade scrape-house --year $y $REPARSE || true
            REPARSE=""   # only the FIRST year clears state; rest append
          done
      - name: Source health
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m copytrade scrape-status >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: copytrade-data-${{ github.run_id }}
