[pytest]
# Collect ONLY this project's tests. `data/` holds cloned upstream repos
# ingest-committees-history clones unitedstates/congress-legislators there
# and those ship their own test suites, which pytest would otherwise try to
# collect and fail on. `data/` is gitignored, so the contents vary per machine.
testpaths = tests
norecursedirs = data .venv .git reports reports_demo __pycache__ .pytest_cache
